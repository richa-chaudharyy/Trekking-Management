{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-11">
                <div class="auth-card shadow-lg">
                    <div class="row g-0">
                        <div class="col-md-5 auth-image-box">
                            <img src="{{ url_for('static', filename='images/register_page.jpg') }}" alt="Trekking image" class="auth-side-img">
                        </div>

                        <div class="col-md-7">
                            <div class="auth-form-box register-form-box">
                                <h3 class="mb-2">Welcome! Create your account</h3>
                                <p class="text-muted mb-4">Register as a trekker or trek staff.</p>

                                <form method="POST" action="{{ url_for('register') }}">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="name" class="form-label">Name</label>
                                            <input type="text" class="form-control" id="name" name="name" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" name="email" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="phone_number" class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" id="phone_number" name="phone_number" minlength="10" maxlength="15" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="role" class="form-label">Role</label>
                                            <select class="form-select" id="role" name="role" required>
                                                <option value="">Select role</option>
                                                <option value="user">User / Trekker</option>
                                                <option value="staff">Trek Staff</option>
                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="password" class="form-label">Password</label>
                                            <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="confirm_password" class="form-label">Confirm Password</label>
                                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100 mt-4">Register</button>
                                </form>

                                <p class="mt-3 mb-0 text-center">
                                    Already registered?
                                    <a href="{{ url_for('login') }}">Login here</a>
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
