{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-10">
                <div class="auth-card shadow-lg">
                    <div class="row g-0">

                        <div class="col-md-5 auth-image-box">
                            <img src="{{ url_for('static', filename='images/login_page.jpg') }}" alt="Trekking image" class="auth-side-img">
                        </div>

                        <div class="col-md-7">
                            <div class="auth-form-box">
                                <h3 class="mb-2">Welcome back! Login now</h3>
                                <p class="text-muted mb-4">Access your account from here.</p>

                                <form method="POST" action="{{ url_for('login') }}">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100 mt-2">Login</button>
                                </form>

                                <p class="mt-4 mb-0 text-center">
                                    New user?
                                    <a href="{{ url_for('register') }}">Create an account</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
