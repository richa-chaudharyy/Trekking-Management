{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Add Trek</h2>
        <p class="text-muted mb-0">Create a new trek for users to view and book later.</p>
    </div>

    <div class="card dashboard-card form-card">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Trek Name</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ form_data.get('name', '') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" required
                               value="{{ form_data.get('location', '') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Difficulty</label>
                        <select name="difficulty" class="form-select" required>
                            <option value="">Select difficulty</option>
                            {% for difficulty in difficulty_options %}
                                <option value="{{ difficulty }}"
                                    {% if form_data.get('difficulty') == difficulty %}selected{% endif %}>
                                    {{ difficulty }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" required>
                            {% for status in status_options %}
                                <option value="{{ status }}"
                                    {% if form_data.get('status', 'Pending') == status %}selected{% endif %}>
                                    {{ status }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Duration</label>
                        <input type="number" name="duration" class="form-control" min="1" required
                               value="{{ form_data.get('duration', '') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Available Slots</label>
                        <input type="number" name="available_slots" class="form-control" min="0" required
                               value="{{ form_data.get('available_slots', '') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control" required
                               value="{{ form_data.get('start_date', '') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" name="end_date" class="form-control" required
                               value="{{ form_data.get('end_date', '') }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control description-box">{{ form_data.get('description', '') }}</textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Add Trek</button>
                    <a href="{{ url_for('admin_treks') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
